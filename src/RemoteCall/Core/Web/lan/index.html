<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>远程消息</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="title">远程消息</div>
    <div class="topbar-actions">
      <button id="rename-btn" class="ghost" type="button">设备：<span id="device-name">加载中…</span></button>
      <button id="logout-btn" class="ghost" type="button">退出</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-filter="all" type="button">全部</button>
    <button class="tab" data-filter="pending" type="button">未完成</button>
    <button class="tab" data-filter="done" type="button">已完成</button>
  </nav>

  <main id="list" class="list"></main>
  <p id="empty" class="empty" hidden>这里还没有消息。</p>

  <form class="composer" id="composer">
    <textarea id="text" rows="2" maxlength="2000" placeholder="输入要发送到本机 ClassIsland 的消息…"></textarea>
    <button id="send" class="primary" type="submit">发送</button>
  </form>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
