# 上架 ClassIsland 插件市场（2.x）用的清单
#
# 与 src/RemoteCall/manifest.yml 的区别：多了插件源（PluginIndex）需要的仓库定位字段。
# 用法：把本文件重命名为 remote.call.yml，放进 ClassIsland/PluginIndex 的 index/plugins-v2/ 目录后发起 PR。
# 文档：https://docs.classisland.tech/dev/plugins/publishing.html
id: remote.call
name: 远程消息
description: 局域网内其他设备通过网页向 ClassIsland 发送消息，消息以主界面组件轮流展示，并在收到时弹出标准提醒。
entranceAssembly: "RemoteCall.dll"
url: https://github.com/yee114514/RemoteCall
repoOwner: yee114514
repoName: RemoteCall
# <默认分支>/<插件项目相对仓库的路径>
assetsRoot: main/src/RemoteCall
# Release 里供下载的插件包文件名（对应 src/RemoteCall/cipx/RemoteCall.cipx）
artifactName: RemoteCall.cipx
tagPattern: "1.*.*.*"
version: 1.0.0.0
apiVersion: 2.1.0.0
author: yee114514
# 只在 Windows 上实测过；在其它平台浏览/安装时市场会给出提示，但不阻止安装
supportedOSPlatforms:
  - Windows
